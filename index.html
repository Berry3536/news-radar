<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light" />
<title>테크 노트 · Tech Note</title>
<!-- No favicon request: the page fetches nothing but data.json. -->
<link rel="icon" href="data:," />
<style>
  /* System fonts only; no external stylesheet or font (RULE10). */
  :root {
    --ink: #1a1a1a;      /* titles, links, the one dark panel */
    --body: #2b2b2b;     /* body text */
    --grey: #6b6b6b;     /* secondary text, 5.3:1 on white */
    --grey-2: #767676;   /* numbers and placeholders, 4.5:1 on white */
    --line: #d6d6d6;     /* 1px borders and the title hairline */
    --line-2: #ebebeb;   /* dividers between items */
    --tint: #f4f4f4;     /* notice panel */
    --accent: #d98a1e;   /* the only colour: items from the last 6 hours */
    --radius: 4px;
    --sans: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    --latin: Arial, "Helvetica Neue", Helvetica, "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }

  * { box-sizing: border-box; }

  /* The script hides the grid and notice with `hidden`; keep it stronger than `display: grid`. */
  [hidden] { display: none !important; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: #fff;
    color: var(--body);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }

  p { margin: 0; }

  .wrap { max-width: 1360px; margin: 0 auto; padding: 56px clamp(16px, 5vw, 72px) 40px; }

  /* Header: eyebrow, title, hairline, then subtitle and controls beside the dark panel. */
  .title-block { padding-bottom: 14px; border-bottom: 1px solid var(--line); }

  .eyebrow {
    font: 700 12px/1.4 var(--latin);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--grey);
  }

  h1 {
    margin: 6px 0 0;
    font-size: 40px;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: -0.01em;
    color: var(--ink);
  }

  .lead {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 360px;
    grid-template-areas: "sub sync" "ctl sync";
    gap: 20px 48px;
    margin-top: 18px;
  }

  .subtitle { grid-area: sub; font-size: 19px; line-height: 1.5; color: var(--body); }

  .sync {
    grid-area: sync;
    align-self: start;
    background: var(--ink);
    color: #fff;
    border-radius: var(--radius);
    padding: 22px 26px 24px;
  }
  .sync-label {
    font: 700 12px/1.4 var(--latin);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #ccc;
  }
  .sync-time {
    margin-top: 10px;
    font: 700 26px/1.2 var(--latin);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }
  .sync-total { margin-top: 12px; font-size: 14px; color: #ccc; }
  .sync-total b { font-family: var(--latin); font-variant-numeric: tabular-nums; color: #fff; }

  .controls {
    grid-area: ctl;
    align-self: end;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
  }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font: inherit;
    font-size: 14px;
    line-height: 1.3;
    color: var(--body);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 7px 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip:hover { border-color: var(--grey); }
  .chip .n {
    margin-left: 6px;
    font-family: var(--latin);
    font-variant-numeric: tabular-nums;
    color: var(--grey);
  }
  .chip.active { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 700; }
  .chip.active .n { color: #ccc; font-weight: 400; }

  .search {
    width: 300px;
    max-width: 100%;
    font: inherit;
    font-size: 14px;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 8px 12px;
    outline: none;
  }
  .search::placeholder { color: var(--grey-2); }
  .search:focus { border-color: var(--ink); }

  .chip:focus-visible, .item a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* Category columns: numbered head, items separated by light rules. */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr));
    gap: 24px;
    align-items: start;
    margin-top: 40px;
  }

  .col {
    min-width: 0;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  /* One category shown: span the page and lay its items out in columns. */
  .col:only-child { grid-column: 1 / -1; }
  .col:only-child .items {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr));
    column-gap: 40px;
  }

  .col-head {
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding: 18px 22px 16px;
    border-bottom: 1px solid var(--line);
  }
  .col-no {
    font: 700 20px/1 var(--latin);
    font-variant-numeric: tabular-nums;
    color: var(--grey-2);
  }
  .col-head h2 {
    flex: 1;
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    line-height: 1.2;
    color: var(--ink);
  }
  .col-head .cnt { font: 400 13px var(--latin); font-variant-numeric: tabular-nums; color: var(--grey); white-space: nowrap; }

  /* The last row's bottom rule is pushed under the column border and clipped. */
  .items { list-style: none; margin: 0 0 -1px; padding: 0 22px; }

  .item { padding: 14px 0 15px; border-bottom: 1px solid var(--line-2); }

  .item a, .item .item-title {
    display: block;
    font-size: 15px;
    line-height: 1.55;
    color: var(--ink);
    text-decoration: none;
  }
  .item a:visited { color: var(--grey); }
  .item a:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }

  .item-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 10px;
    margin-top: 6px;
    font-size: 12.5px;
    line-height: 1.4;
    color: var(--grey);
  }
  .item-meta .time { font-family: var(--latin); font-variant-numeric: tabular-nums; }
  /* Fresh (under 6 hours): bold ink text with a small accent square; the text, not the colour, carries it. */
  .item-meta .time.fresh { color: var(--ink); font-weight: 700; }
  .item-meta .time.fresh::before {
    content: "";
    display: inline-block;
    width: 7px;
    height: 7px;
    margin-right: 6px;
    border-radius: 1px;
    background: var(--accent);
    vertical-align: 1px;
  }

  .empty-col { padding: 22px; font-size: 14px; color: var(--grey); }

  .notice {
    margin-top: 40px;
    padding: 26px 30px;
    background: var(--tint);
    border: 1px solid var(--line-2);
    border-radius: var(--radius);
    font-size: 15px;
    color: var(--body);
  }
  .notice.error { background: #fff; border-color: var(--ink); color: var(--ink); }

  footer {
    margin-top: 56px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    font-size: 12.5px;
    color: var(--grey);
  }
  footer code { font-family: Consolas, Menlo, monospace; font-size: 0.95em; color: var(--body); }

  @media (max-width: 860px) {
    .wrap { padding-top: 36px; }
    h1 { font-size: 32px; }
    .subtitle { font-size: 16px; }
    .lead { grid-template-columns: minmax(0, 1fr); grid-template-areas: "sub" "sync" "ctl"; gap: 16px; }
    .sync { padding: 18px 20px 20px; }
    .sync-time { font-size: 24px; }
    .controls { align-items: stretch; }
    .search { width: 100%; }
    .grid { margin-top: 28px; gap: 16px; }
    .col-head { padding: 16px 16px 14px; }
    .items { padding: 0 16px; }
    .empty-col { padding: 18px 16px; }
    .notice { padding: 20px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-block">
      <p class="eyebrow">Tech Note · RSS digest</p>
      <h1>테크 노트</h1>
    </div>
    <div class="lead">
      <p class="subtitle">AI · 반도체 · 자동차 · 배터리 · 로봇 분야의 새 기사를 RSS로 모아 최신순으로 정리합니다.</p>
      <section class="sync" aria-label="수집 상태">
        <p class="sync-label">Last sync</p>
        <p class="sync-time" id="genTime">—</p>
        <p class="sync-total">전체 <b id="totalCount">—</b>건</p>
      </section>
      <div class="controls">
        <div class="chips" id="chips" role="group" aria-label="분야"></div>
        <input class="search" id="search" type="search" aria-label="제목·출처 검색"
               placeholder="제목·출처 검색" autocomplete="off" spellcheck="false" />
      </div>
    </div>
  </header>

  <main id="main">
    <div class="notice" id="loading">데이터를 불러오는 중…</div>
    <div class="grid" id="grid" hidden></div>
  </main>

  <footer>
    GitHub Actions가 예약 시각(00·06·12·18 UTC, 늦어질 수 있음)에 RSS를 모아 정적 페이지로 보여 줍니다.
    출처 편집은 <code>feeds.json</code>.
  </footer>
</div>

<script>
"use strict";

var state = {
  data: null,
  activeCat: "all",
  query: ""
};

// --- XSS 방지: 텍스트 escape ---
function esc(s) {
  if (s == null) return "";
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// --- 링크 스킴 검사: http(s)만 href로 (RULE11) ---
// esc()는 javascript:·data: 같은 스킴을 막지 못한다. 수집기도 걸러 내지만 data.json만 믿지 않는다.
function isWebLink(s) {
  return typeof s === "string" && /^https?:\/\//i.test(s);
}

// --- 상대시간 ---
function relativeTime(iso) {
  if (!iso) return { label: "날짜 미상", fresh: false };
  var t = Date.parse(iso);
  if (isNaN(t)) return { label: "날짜 미상", fresh: false };
  var diff = Date.now() - t;
  var sec = Math.floor(diff / 1000);
  if (sec < 0) sec = 0;
  var min = Math.floor(sec / 60);
  var hr = Math.floor(min / 60);
  var day = Math.floor(hr / 24);
  if (sec < 60) return { label: "방금", fresh: true };
  if (min < 60) return { label: min + "분 전", fresh: true };
  if (hr < 24) return { label: hr + "시간 전", fresh: hr < 6 };
  if (day < 7) return { label: day + "일 전", fresh: false };
  var d = new Date(t);
  var label = d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0");
  return { label: label, fresh: false };
}

function fmtDateTime(iso) {
  if (!iso) return "—";
  var t = Date.parse(iso);
  if (isNaN(t)) return "—";
  var d = new Date(t);
  return d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0") + " " +
    String(d.getHours()).padStart(2, "0") + ":" +
    String(d.getMinutes()).padStart(2, "0");
}

// Header "last sync" only: formatted in UTC so the value matches its "UTC" label.
function fmtDateTimeUTC(iso) {
  if (!iso) return "—";
  var t = Date.parse(iso);
  if (isNaN(t)) return "—";
  var d = new Date(t);
  return d.getUTCFullYear() + "-" +
    String(d.getUTCMonth() + 1).padStart(2, "0") + "-" +
    String(d.getUTCDate()).padStart(2, "0") + " " +
    String(d.getUTCHours()).padStart(2, "0") + ":" +
    String(d.getUTCMinutes()).padStart(2, "0");
}

function matchesQuery(item, q) {
  if (!q) return true;
  var hay = (item.title + " " + item.source).toLowerCase();
  return hay.indexOf(q) !== -1;
}

function chipHtml(key, label, n) {
  var on = state.activeCat === key;
  return '<button type="button" class="chip' + (on ? " active" : "") +
    '" aria-pressed="' + on + '" data-cat="' + esc(key) + '">' + esc(label) +
    '<span class="n">' + esc(n) + '</span></button>';
}

function renderChips() {
  var chips = document.getElementById("chips");
  var cats = state.data.categories || [];
  var total = cats.reduce(function (a, c) { return a + (c.count || 0); }, 0);

  var html = chipHtml("all", "전체", total);
  cats.forEach(function (c) {
    html += chipHtml(c.key, c.label, c.count || 0);
  });
  chips.innerHTML = html;

  Array.prototype.forEach.call(chips.querySelectorAll(".chip"), function (btn) {
    btn.addEventListener("click", function () {
      state.activeCat = btn.getAttribute("data-cat");
      renderChips();
      renderGrid();
    });
  });
}

function renderGrid() {
  var grid = document.getElementById("grid");
  var cats = state.data.categories || [];
  var q = state.query;
  var visible = cats.filter(function (c) {
    return state.activeCat === "all" || c.key === state.activeCat;
  });

  var anyShown = 0;
  var out = "";

  visible.forEach(function (c) {
    var items = (c.items || []).filter(function (it) { return matchesQuery(it, q); });
    anyShown += items.length;

    var body;
    if (items.length === 0) {
      body = '<div class="empty-col">' +
        (q ? "검색 결과 없음" : "표시할 항목이 없습니다") + "</div>";
    } else {
      body = '<ul class="items">';
      items.forEach(function (it) {
        var rt = relativeTime(it.published);
        var title = esc(it.title || "(제목 없음)");
        var head = isWebLink(it.link)
          ? '<a href="' + esc(it.link) + '" target="_blank" rel="noopener noreferrer">' + title + '</a>'
          : '<span class="item-title">' + title + '</span>';
        body += '<li class="item">' + head +
          '<div class="item-meta">' +
            '<span class="src">' + esc(it.source || "") + '</span>' +
            '<span class="time' + (rt.fresh ? " fresh" : "") + '" title="' +
              esc(fmtDateTime(it.published)) + '">' + esc(rt.label) + '</span>' +
          '</div>' +
        '</li>';
      });
      body += "</ul>";
    }

    // Number by position in data.json, so a category keeps its number when filtered alone.
    var no = String(cats.indexOf(c) + 1).padStart(2, "0");
    out += '<section class="col">' +
      '<div class="col-head"><span class="col-no">' + no + '</span>' +
      '<h2>' + esc(c.label) + '</h2>' +
      '<span class="cnt">' + items.length + '건</span></div>' +
      body +
    '</section>';
  });

  if (anyShown === 0 && q) {
    grid.hidden = true;
    showNotice('"' + esc(q) + '" 에 대한 검색 결과가 없습니다.', false);
    return;
  }

  hideNotice();
  grid.innerHTML = out;
  grid.hidden = false;
}

function showNotice(msg, isError) {
  var grid = document.getElementById("grid");
  grid.hidden = true;
  var el = document.getElementById("loading");
  el.hidden = false;
  el.className = "notice" + (isError ? " error" : "");
  el.innerHTML = msg;
}
function hideNotice() {
  document.getElementById("loading").hidden = true;
}

function applyData(data) {
  state.data = data;

  var cats = data.categories || [];
  var total = cats.reduce(function (a, c) { return a + (c.count || 0); }, 0);
  document.getElementById("genTime").textContent = fmtDateTimeUTC(data.generated_at) + " UTC";
  document.getElementById("totalCount").textContent = total;

  if (total === 0) {
    renderChips();
    showNotice("수집된 항목이 없습니다. feeds.json의 피드 URL과 필터를 확인하세요.", false);
    return;
  }

  renderChips();
  renderGrid();
}

function load() {
  fetch("data.json?_=" + Date.now(), { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(applyData)
    .catch(function (err) {
      showNotice(
        "데이터를 불러오지 못했습니다. (" + esc(err.message) + ")<br>" +
        "data.json이 생성되었는지, GitHub Actions가 1회 이상 실행됐는지 확인하세요.",
        true
      );
    });
}

document.getElementById("search").addEventListener("input", function (e) {
  state.query = e.target.value.trim().toLowerCase();
  if (state.data) renderGrid();
});

load();
</script>
</body>
</html>
