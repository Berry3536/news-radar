[project]
name = "news-radar"
version = "1.0.0"
description = "Serverless tech news dashboard: scheduled RSS aggregation published to GitHub Pages"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "feedparser>=6.0.0",
]

# Dev tooling as a dependency group: `uv sync` installs it by default.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["aggregate"]
