name: Aggregate tech news

on:
  schedule:
    # 매일 00, 06, 12, 18시(UTC). 단, GitHub의 scheduled cron은
    # 정시를 보장하지 않으며 지연/스킵될 수 있다(README 참고).
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write          # gh-pages 브랜치 push에 필수

concurrency:
  group: aggregate
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Aggregate feeds
        run: python aggregate.py

      # 결과물은 gh-pages 브랜치(커밋 1개, 매번 덮어씀)로만 배포한다.
      # master/develop에는 봇 커밋이 남지 않는다(gitflow: master는 release/hotfix 머지만).
      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir site
          cp index.html data.json site/
          touch site/.nojekyll
          cd site
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore: publish data.json ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
